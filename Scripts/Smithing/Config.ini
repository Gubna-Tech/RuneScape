#PLEASE NOTE, AT THIS TIME, THIS SCRIPT DOES NOT AUTO-BANK OR REHEAT ITEMS
#best use case until banking and heating are implemented is to make arrowheads/dart tips

#this version of the smithing script does not have the option to choose between base,+1,+2,+3,+4,+5
#script is meant for very basic smithing needs, such as arrowheads/dart tips

[Sleep Brief]
type=timer
min=450
max=1250

[Sleep Normal]
type=timer
min=1800
max=4500

[Sleep Short]
type=timer
min=1000
max=3500

[Sleep Smith]
type=timer
min=18000
max=21000

#not all items need the scroll function, items are the bottom of the menu need the scroll
#min should be minimum amount of scrolls needed for the item frame to be on-screen
#max should be between 8-12 more than min to ensure randomness
#if no scroll is needed, leave each as 0
[Scroll]
min=8
max=12

#amount is the amount of extra items to make, by default smithing makes 1 item. Max 27 can be added
[Extra Items]
amount=0

#base modifier coordinates
[Quantity]
type=coordinate
xmin=
xmax=
ymin=
ymax=

[Anvil]
type=coordinate
xmin=
xmax=
ymin=
ymax=

[Bar]
type=coordinate
xmin=
xmax=
ymin=
ymax=

[Item]
type=coordinate
xmin=
xmax=
ymin=
ymax=
