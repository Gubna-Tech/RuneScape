#MAKE SURE TO HAVE THE SHARP SHELL SHARDS IN YOUR INVENTORY BEFORE STARTING THE SCRIPT

[Sleep Brief]
type=timer
min=500
max=1200

[Sleep Normal]
type=timer
min=1800
max=4000

[Sleep Short]
type=timer
min=1200
max=3500

#timer assumes you have (60) Sharp Shell Shards in your inventory to be burned at minimum per run/loop of the script
[Sleep Burn]
type=timer
min=185000
max=195000

[Sharp Shell Shard]
type=coordinate
xmin=
xmax=
ymin=
ymax=

#DO NOT TOUCH, unless the right-click to Ignite option is misclicking. (setup on a 1920x1080 monitor)
#to fix, only adjust miny/maxy
[Offset - Shard]
minx=-65
maxx=65
miny=30
maxy=44
