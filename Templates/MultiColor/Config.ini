coordinate=Pixel Coordinate Two
action=Action Location Two A
color=0xFFFFFF

#Second target color watched at Pixel Coordinate Two.
[Target Color Two B]
type=color
coordinate=Pixel Coordinate Two
action=Action Location Two B
color=0xFFFFFF

