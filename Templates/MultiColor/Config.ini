#First exact pixel to monitor. Multiple target colors below can use this same coordinate.
[Pixel Coordinate One]
type=coordinate
x=
y=

#First target color watched at Pixel Coordinate One.
#When this color is detected, Action Location One A is used.
[Target Color One A]
type=color
coordinate=Pixel Coordinate One
action=Action Location One A
color=0xFFFFFF

#Second target color watched at Pixel Coordinate One.
#It may use a different action while sharing the same monitored pixel.
[Target Color One B]
type=color
coordinate=Pixel Coordinate One
action=Action Location One B
color=0xFFFFFF

#Action used when Target Color One A is detected.
[Action Location One A]
type=coordinate
xmin=
xmax=
ymin=
ymax=

#Action used when Target Color One B is detected.
[Action Location One B]
type=coordinate
xmin=
xmax=
ymin=
ymax=

#Second exact pixel to monitor. Add more coordinate groups using the same pattern.
[Pixel Coordinate Two]
type=coordinate
x=
y=

